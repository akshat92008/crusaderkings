name: Faith and culture browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/faith-institutions.js'
      - 'src/identity-systems.js'
      - 'src/heritage-systems.js'
      - 'src/kingdom-ui.js'
      - 'scripts/faith_browser_smoke.py'
      - '.github/workflows/faith-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faith-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/faith_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faith-browser-screenshots
          path: qa-screenshots/
