name: Animated battle visual smoke
on:
  push:
    branches: [feature/ck-coc-warfare-07]
    paths:
      - src/battle.js
      - src/three-battle-scene.js
      - src/military-doctrines.js
      - src/invasions.js
      - src/main.js
      - src/three-battle.bundle.js
      - src/battlefield-art.js
      - src/battlefield-layout.js
      - scripts/battle_browser_smoke.py
      - .github/workflows/battle-visual.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium for visual gameplay checks
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Exercise real 3D soldier load, animation and combat simulation
        run: python scripts/battle_browser_smoke.py
      - name: Upload actual battle screenshots and error details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-of-nations-animated-army-battle
          path: |
            docs/battle-real-kaykit-3d.png
            docs/battle-fallback-only.png
            docs/battle-browser-error.txt
          if-no-files-found: warn
      # Screenshots are uploaded as workflow artifacts above; do not push binary
      # PNGs from parallel test jobs, which creates non-fast-forward conflicts.
