name: Animated battle visual smoke
on:
  push:
    branches: [feature/animated-3d-armies-03]
    paths:
      - src/battle.js
      - src/three-battle.bundle.js
      - scripts/battle_browser_smoke.py
      - .github/workflows/battle-visual.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium for visual gameplay checks
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Exercise real 3D soldier load, animation and combat simulation
        run: python scripts/battle_browser_smoke.py
      - name: Upload actual battle screenshots and error details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-of-nations-animated-army-battle
          path: |
            docs/battle-real-kaykit-3d.png
            docs/battle-fallback-only.png
            docs/battle-browser-error.txt
          if-no-files-found: warn
      - name: Attach screenshots to development branch
        if: success()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/battle-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Attach actual animated battle Chromium screenshot"
            git push
          fi
