name: Runtime asset catalogue
on:
  push:
    branches: [codex/runtime-art-and-audio]
    paths: ['scripts/inspect_art_sheets.py', '.github/workflows/runtime-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: python scripts/inspect_art_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: asset-contact-sheets
          path: dist/asset-audit
          if-no-files-found: error
