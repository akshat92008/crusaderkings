name: Publish playable kingdom AI and royal content build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify gameplay sources
        run: |
          npm test
          npm run check
      - name: Package runnable game without raw source assets
        run: python3 scripts/package_playable.py
      - name: Upload playtest ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crown-of-Nations-1450-Kingdoms-and-AI-Playtest
          path: dist/Crown-of-Nations-1450-Kingdoms-and-AI-Playtest.zip
          if-no-files-found: error
      - name: Publish public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.6.0-kingdoms-ai
          ZIP=dist/Crown-of-Nations-1450-Kingdoms-and-AI-Playtest.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Crown of Nations: 1450 — Kingdoms and AI Playtest" --notes "Playable prototype with 44 fictional royal dynasties, rival kingdom AI, courts, 23 narrative events, treaties, trade income, diplomacy, 1450 atlas, objectives and legacy outcome; keeps animated KayKit 3D battles and fortresses. Synthetic borders and advanced systems remain incomplete. Not a finished game. Download, extract, and serve the game folder with python3 -m http.server 8080." --prerelease
          fi
