name: Publish playable kingdom AI and royal content build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify gameplay sources
        run: |
          npm test
          npm run check
      - name: Install sprite optimization dependency
        run: python3 -m pip install pillow
      - name: Package runnable game without raw source assets
        run: python3 scripts/package_playable.py
      - name: Upload playtest ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crown-of-Nations-1450-Cultural-Warfare-Playtest
          path: dist/Crown-of-Nations-1450-Cultural-Warfare-Playtest.zip
          if-no-files-found: error
      - name: Publish public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.7.0-cultural-warfare
          ZIP=dist/Crown-of-Nations-1450-Cultural-Warfare-Playtest.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Crown of Nations: 1450 — Cultural Warfare Playtest" --notes "Playable preview with 15 distinct military doctrines, ten tactical formations, actual deployment choices, enemy-initiated invasions and playable settlement defense. Includes the existing courts, trade, 1450 atlas, animated KayKit soldiers and fortresses. Historical accuracy and fully destructible sieges are unfinished. Not a finished game. Download, extract, and serve the game folder with python3 -m http.server 8080." --prerelease
          fi
