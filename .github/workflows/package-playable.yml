name: Publish small playable atlas playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify gameplay sources
        run: |
          npm test
          npm run check
      - name: Package runnable game without raw source assets
        run: python3 scripts/package_playable.py
      - name: Upload playtest ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crown-of-Nations-1450-Atlas-Playtest
          path: dist/Crown-of-Nations-1450-Atlas-Playtest.zip
          if-no-files-found: error
      - name: Publish public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.3.0-atlas-playtest
          ZIP=dist/Crown-of-Nations-1450-Atlas-Playtest.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Crown of Nations: 1450 — Atlas Playtest" --notes "Playable preview with a new CK-style political atlas, an incomplete 1450 historical-reference layer, the existing economy/diplomacy simulation, and prototype real-time WebGL battles. Not a finished game. Download, extract, and serve the game folder with python3 -m http.server 8080." --prerelease
          fi
