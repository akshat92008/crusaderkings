name: Desktop and mobile campaign browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/mobile_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-campaign-screenshots
          path: qa-screenshots/
