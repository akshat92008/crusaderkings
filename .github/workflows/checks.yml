name: Crown of Nations checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
