name: Build reviewed game art
on:
  push:
    branches: [chatgpt/art-integration]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/build_game_art.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/game-art
          git diff --cached --quiet || git commit -m 'Extract optimized reviewed artwork for gameplay'
          git push origin HEAD:chatgpt/art-integration
