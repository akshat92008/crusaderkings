name: Inspect uploaded art sheets
on:
  push:
    branches: [chatgpt/art-integration]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/art_contact_sheet.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art-review
          git diff --cached --quiet || git commit -m 'Build contact sheets for art review'
          git push origin HEAD:chatgpt/art-integration
