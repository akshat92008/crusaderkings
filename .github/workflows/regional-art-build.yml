name: Build reviewed regional battlefield and verify artwork
on:
  push:
    branches: [chatgpt/regional-art-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx esbuild src/three-battle-scene.js --bundle --minify --format=esm --platform=browser --target=es2022 --legal-comments=inline --outfile=src/three-battle.bundle.js
      - run: npm run check
      - run: node --test tests/game-art.test.mjs
      - run: python -m pip install Pillow
      - run: |
          python - <<'PY'
          from PIL import Image
          p=Image.open('assets/icons/Medieval_strategy_game_icon_sheet_cfd2f837.png').convert('RGB')
          p.thumbnail((1024,1024))
          p.save('icon-review.jpg',quality=85)
          PY
      - run: python scripts/package_playable.py && python scripts/check_release_package.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/three-battle.bundle.js icon-review.jpg
          git diff --cached --quiet || git commit -m 'Build regional soldiers and prepare final icon review'
          git push origin HEAD:chatgpt/regional-art-build
