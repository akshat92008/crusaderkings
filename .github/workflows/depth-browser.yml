name: Campaign depth browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ambition-goals.js'
      - 'src/chronicle-systems.js'
      - 'src/regional-situations.js'
      - 'src/heritage-systems.js'
      - 'src/depth-content.js'
      - 'src/expanded-content.js'
      - 'src/kingdom-ui.js'
      - 'scripts/depth_browser_smoke.py'
      - '.github/workflows/depth-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/depth_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-depth-screenshots
          path: qa-screenshots/
